[package]
name = "renew"
version = "0.5.0"
edition = "2024"
authors = ["Scott Idler <scott.idler@tatari.tv>"]
build = "build.rs"
description = "Library for self-update: check, install, and revert versioned GitHub release binaries"
repository = "https://github.com/tatari-tv/renew"
license = "MIT"
rust-version = "1.100"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
libc = "0.2.186"
log = "0.4.29"
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
ureq = { version = "3.3.0", features = ["rustls"] }
[build-dependencies]
build-version = { git = "https://github.com/tatari-tv/build-version-rs", tag = "v0.1.0", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.27.0"
# Also a regular dependency; this entry only adds the `macros` feature (`datetime!`) for tests.
time = { version = "0.3.55", features = ["macros"] }
