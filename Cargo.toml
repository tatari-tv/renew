[package]
name = "renew"
version = "0.1.0"
edition = "2024"
authors = ["Scott Idler <scott.idler@tatari.tv>"]
build = "build.rs"
description = "Library for self-update: check, install, and revert versioned GitHub release binaries"
repository = "https://github.com/tatari-tv/renew"
license = "MIT"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
libc = "0.2.186"
log = "0.4.29"
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = "0.4.45"
thiserror = "2.0.18"
ureq = { version = "3.3.0", features = ["rustls"] }
[build-dependencies]

[dev-dependencies]
tempfile = "3.27.0"
